name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release and upload the APK

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25" # matches gradle/gradle-daemon-jvm.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MANAZONE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MANAZONE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MANAZONE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Derive version from tag
        run: |
          echo "MANAZONE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "MANAZONE_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          MANAZONE_KEYSTORE_PASSWORD: ${{ secrets.MANAZONE_KEYSTORE_PASSWORD }}
          MANAZONE_KEY_ALIAS: ${{ secrets.MANAZONE_KEY_ALIAS }}
          MANAZONE_KEY_PASSWORD: ${{ secrets.MANAZONE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Signed APK not found; check the signing secrets"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "manazone-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "manazone-${GITHUB_REF_NAME}.apk" \
            --title "Manazone ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
